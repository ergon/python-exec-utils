[project]
name = "exec_utils"
version = "0.1.1"
description = "Versatile utility to execute commands"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Reto Schuettel", email = "reto.schuettel@ergon.ch" },
]
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
PyPI = "https://pypi.org/project/exec-utils/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exec_utils"]

[tool.hatch.build.targets.sdist]
exclude = ["exec_utils/tests"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
